name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test on M1
    runs-on: [self-hosted, macOS, ARM64, m1-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: /bin/bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner environment
        run: |
          uname -sm
          node --version
          npm --version

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end smoke test
        run: ./scripts/e2e.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-e2e-${{ github.run_id }}
          path: |
            e2e-server.log
            e2e-response.json
          if-no-files-found: warn
          retention-days: 7
